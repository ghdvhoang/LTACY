<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Yen Center Learning Operating System — frontend demo kết nối hành trình từ lead đến renewal" />
  <meta name="theme-color" content="#071b33" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F2B5B'/%3E%3Cpath d='M12 25 32 14l20 11-20 11L12 25Zm8 8v10c8 6 16 6 24 0V33' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>Yen Center — Full Journey Frontend Demo v3</title>
  <style>:root {
  --brand-950: #081b39;
  --brand-900: #0f2b5b;
  --brand-800: #173d77;
  --brand-700: #1d4f91;
  --primary-700: #1d4ed8;
  --primary-600: #2563eb;
  --primary-500: #3b82f6;
  --primary-100: #dbeafe;
  --primary-50: #eff6ff;
  --success-700: #137043;
  --success-600: #198754;
  --success-100: #d8f3e5;
  --success-50: #effaf4;
  --warning-700: #b45309;
  --warning-600: #d97706;
  --warning-100: #fef0c7;
  --warning-50: #fffbeb;
  --danger-700: #b42318;
  --danger-600: #dc2626;
  --danger-100: #fee2e2;
  --danger-50: #fff5f5;
  --violet-700: #6d28d9;
  --violet-100: #ede9fe;
  --ink-950: #0d1726;
  --ink-900: #111827;
  --ink-700: #334155;
  --ink-600: #475569;
  --ink-500: #64748b;
  --ink-400: #94a3b8;
  --line-300: #cbd5e1;
  --line-200: #e2e8f0;
  --line-100: #eef2f6;
  --surface: #ffffff;
  --page: #f6f8fb;
  --page-warm: #fbfaf8;
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-sm: 0 8px 24px rgba(15, 43, 91, 0.08);
  --shadow-md: 0 18px 48px rgba(15, 43, 91, 0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --sidebar: 248px;
  --topbar: 68px;
  --container: 1200px;
  --font: Inter, "Be Vietnam Pro", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink-900);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }

.skip-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 2000;
  transform: translateY(-150%);
  background: var(--brand-900);
  color: #fff;
  padding: 10px 14px;
  border-radius: 6px;
}
.skip-link:focus { transform: translateY(0); }

.container { width: min(calc(100% - 40px), var(--container)); margin: 0 auto; }
.muted { color: var(--ink-500); }
.text-small { font-size: 13px; }
.text-xs { font-size: 12px; }
.text-right { text-align: right; }
.stack { display: grid; gap: 14px; }
.stack-lg { display: grid; gap: 24px; }
.inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hidden { display: none !important; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Brand */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  color: var(--brand-900);
  letter-spacing: -0.02em;
}
.brand-mark {
  position: relative;
  width: 34px;
  height: 28px;
  flex: 0 0 auto;
}
.brand-mark::before {
  content: "";
  position: absolute;
  top: 1px;
  left: 2px;
  width: 29px;
  height: 19px;
  background: var(--brand-900);
  clip-path: polygon(50% 0, 100% 30%, 50% 60%, 0 30%);
}
.brand-mark::after {
  content: "";
  position: absolute;
  left: 9px;
  top: 13px;
  width: 17px;
  height: 11px;
  border-radius: 0 0 9px 9px;
  border: 3px solid var(--primary-600);
  border-top: 0;
}
.brand-copy { display: grid; line-height: 1.05; }
.brand-copy strong { font-size: 16px; }
.brand-copy small { font-size: 10px; font-weight: 650; color: var(--ink-500); letter-spacing: 0.04em; }

/* Buttons */
.btn {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 8px;
  border: 1px solid transparent;
  padding: 9px 15px;
  font-weight: 700;
  font-size: 14px;
  transition: 140ms ease;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.22);
  outline-offset: 2px;
}
.btn-primary { background: var(--brand-900); color: #fff; box-shadow: var(--shadow-xs); }
.btn-primary:hover { background: var(--brand-800); }
.btn-blue { background: var(--primary-600); color: #fff; }
.btn-blue:hover { background: var(--primary-700); }
.btn-secondary { background: #fff; color: var(--brand-900); border-color: var(--line-300); }
.btn-secondary:hover { border-color: var(--brand-700); background: var(--primary-50); }
.btn-ghost { background: transparent; color: var(--ink-700); border-color: transparent; }
.btn-ghost:hover { background: var(--line-100); }
.btn-success { background: var(--success-600); color: #fff; }
.btn-danger { background: #fff; color: var(--danger-700); border-color: var(--danger-100); }
.btn-sm { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn-lg { min-height: 48px; padding: 12px 20px; font-size: 15px; }
.btn-block { width: 100%; }
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line-200);
  background: #fff;
  color: var(--ink-600);
}
.icon-btn:hover { color: var(--brand-900); border-color: var(--line-300); }

/* Public website */
.public-page { min-height: 100vh; background: var(--surface); }
.public-header {
  height: 72px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.96);
  border-bottom: 1px solid var(--line-100);
  backdrop-filter: blur(12px);
}
.public-header-inner { height: 100%; display: flex; align-items: center; gap: 28px; }
.public-nav { margin-left: auto; display: flex; align-items: center; gap: 24px; font-size: 13px; font-weight: 650; color: var(--ink-700); }
.public-nav a:hover, .public-nav a.active { color: var(--primary-700); }
.public-actions { display: flex; gap: 8px; }
.mobile-menu-btn { display: none; margin-left: auto; }

.hero {
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--line-100);
  background:
    radial-gradient(circle at 82% 18%, rgba(37, 99, 235, 0.09), transparent 30%),
    linear-gradient(180deg, #fbfdff 0%, #ffffff 78%);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(15,43,91,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(15,43,91,.035) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 80%);
}
.hero-grid { position: relative; display: grid; grid-template-columns: 1.02fr .98fr; align-items: center; gap: 60px; padding: 80px 0 76px; }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid #bfdbfe;
  border-radius: 999px;
  background: var(--primary-50);
  color: var(--primary-700);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .025em;
  text-transform: uppercase;
}
.hero h1, .page-hero h1 {
  margin: 20px 0 18px;
  font-size: clamp(40px, 5vw, 62px);
  line-height: 1.08;
  letter-spacing: -0.045em;
  color: var(--brand-950);
}
.hero h1 span { color: var(--primary-600); }
.hero p { max-width: 610px; font-size: 18px; color: var(--ink-600); margin: 0 0 28px; }
.hero-proof { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 26px; color: var(--ink-600); font-size: 13px; }
.hero-proof span { display: flex; align-items: center; gap: 7px; }
.check-dot { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--success-100); color: var(--success-700); font-size: 11px; font-weight: 900; }

.product-preview {
  position: relative;
  border: 1px solid #dbe4ef;
  border-radius: 18px;
  background: #fff;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  transform: rotate(.2deg);
}
.preview-top { height: 42px; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--line-100); background: #fbfcfe; }
.preview-dots { display: flex; gap: 5px; }
.preview-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-300); }
.preview-app { display: grid; grid-template-columns: 120px 1fr; min-height: 355px; }
.preview-sidebar { background: var(--brand-950); color: #dbeafe; padding: 20px 14px; }
.preview-sidebar b { color: #fff; font-size: 12px; }
.preview-menu { display: grid; gap: 7px; margin-top: 22px; }
.preview-menu span { padding: 8px; border-radius: 6px; font-size: 9px; opacity: .72; }
.preview-menu span:first-child { background: rgba(255,255,255,.12); opacity: 1; }
.preview-main { padding: 20px; background: #f8fafc; }
.preview-title { height: 12px; width: 42%; border-radius: 4px; background: #cbd5e1; margin-bottom: 18px; }
.preview-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.preview-kpi { min-height: 74px; border: 1px solid var(--line-200); border-radius: 9px; background: #fff; padding: 12px; }
.preview-kpi small { display: block; color: var(--ink-400); font-size: 8px; }
.preview-kpi strong { display: block; margin-top: 8px; font-size: 19px; color: var(--brand-900); }
.preview-chart { height: 128px; margin-top: 12px; border: 1px solid var(--line-200); border-radius: 9px; background: #fff; padding: 16px; display: flex; align-items: flex-end; gap: 8px; }
.preview-chart i { flex: 1; border-radius: 3px 3px 0 0; background: #bfdbfe; }
.preview-chart i:nth-child(2), .preview-chart i:nth-child(5) { background: #60a5fa; }
.preview-list { margin-top: 12px; display: grid; gap: 7px; }
.preview-list span { height: 9px; border-radius: 3px; background: #e2e8f0; }
.preview-badge {
  position: absolute;
  right: -24px;
  bottom: 24px;
  width: 178px;
  padding: 14px;
  border: 1px solid #bbf7d0;
  border-radius: 12px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.preview-badge strong { display: block; color: var(--success-700); }
.preview-badge small { color: var(--ink-500); }

.section { padding: 78px 0; }
.section-soft { background: var(--page); border-top: 1px solid var(--line-100); border-bottom: 1px solid var(--line-100); }
.section-warm { background: var(--page-warm); }
.section-head { max-width: 720px; margin-bottom: 34px; }
.section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
.section-head h2 { margin: 8px 0 12px; color: var(--brand-950); font-size: clamp(28px, 4vw, 40px); line-height: 1.18; letter-spacing: -0.035em; }
.section-head p { margin: 0; color: var(--ink-600); font-size: 16px; }

.audience-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.audience-card { position: relative; overflow: hidden; min-height: 290px; padding: 30px; border: 1px solid var(--line-200); border-radius: 16px; background: #fff; box-shadow: var(--shadow-xs); }
.audience-card::after { content:""; position:absolute; width:180px; height:180px; border-radius:50%; right:-60px; bottom:-75px; background: var(--primary-50); }
.audience-card.b2b::after { background: #eef2ff; }
.audience-card h3 { margin: 18px 0 8px; font-size: 24px; color: var(--brand-950); }
.audience-card p { max-width: 440px; color: var(--ink-600); }
.audience-card ul { padding: 0; margin: 18px 0 22px; list-style: none; display: grid; gap: 8px; }
.audience-card li { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-700); }
.audience-card .btn { position: relative; z-index: 1; }
.audience-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 11px; background: var(--primary-50); color: var(--primary-700); font-size: 21px; font-weight: 900; }
.b2b .audience-icon { background: #eef2ff; color: var(--violet-700); }

.workflow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; counter-reset: steps; }
.workflow-step { position: relative; padding: 0 16px; text-align: center; }
.workflow-step:not(:last-child)::after { content: ""; position: absolute; top: 25px; left: 67%; width: 68%; border-top: 1px dashed #a7b8cc; }
.workflow-number { position: relative; z-index: 1; width: 52px; height: 52px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 1px solid #bfdbfe; color: var(--primary-700); box-shadow: var(--shadow-xs); font-weight: 850; }
.workflow-step h3 { margin: 0 0 7px; font-size: 15px; color: var(--brand-950); }
.workflow-step p { margin: 0; font-size: 12px; color: var(--ink-500); }

.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.feature-card { padding: 22px; border: 1px solid var(--line-200); border-radius: 12px; background: #fff; }
.feature-card h3 { margin: 15px 0 7px; font-size: 17px; color: var(--brand-950); }
.feature-card p { margin: 0; color: var(--ink-500); font-size: 14px; }
.feature-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-50); color: var(--primary-700); font-weight: 900; }

.metric-row { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line-200); border-radius: 14px; overflow: hidden; background: #fff; }
.metric { padding: 24px; text-align: center; }
.metric + .metric { border-left: 1px solid var(--line-200); }
.metric strong { display: block; color: var(--brand-900); font-size: 30px; letter-spacing: -.04em; }
.metric small { color: var(--ink-500); }
.data-label { display: inline-block; margin-top: 10px; font-size: 11px; color: var(--ink-400); }

.program-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.program-card { overflow: hidden; border: 1px solid var(--line-200); border-radius: 14px; background: #fff; }
.program-cover { min-height: 132px; padding: 22px; display: flex; align-items: flex-end; background: linear-gradient(130deg, #eef5ff, #dbeafe); color: var(--brand-900); }
.program-card:nth-child(2) .program-cover { background: linear-gradient(130deg, #f5f3ff, #ede9fe); }
.program-card:nth-child(3) .program-cover { background: linear-gradient(130deg, #effaf4, #d8f3e5); }
.program-cover strong { max-width: 210px; font-size: 22px; line-height: 1.15; }
.program-body { padding: 20px; }
.program-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-500); font-size: 12px; }
.program-body p { color: var(--ink-600); min-height: 66px; }

.public-cta { padding: 34px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 30px; border-radius: 18px; background: var(--brand-950); color: #fff; }
.public-cta h2 { margin: 0 0 8px; font-size: 28px; }
.public-cta p { margin: 0; color: #c8d6ea; }
.public-footer { padding: 52px 0 26px; background: #08182f; color: #d8e2f0; }
.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 34px; }
.public-footer .brand { color: #fff; }
.public-footer .brand-mark::before { background: #fff; }
.footer-col h3 { margin: 0 0 12px; color: #fff; font-size: 13px; }
.footer-col a, .footer-col span { display: block; margin: 7px 0; color: #aebdd1; font-size: 13px; }
.footer-bottom { display: flex; justify-content: space-between; gap: 20px; margin-top: 34px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); color: #8294ad; font-size: 12px; }

.page-hero { padding: 64px 0 50px; background: var(--page); border-bottom: 1px solid var(--line-100); }
.page-hero h1 { max-width: 820px; margin-top: 12px; font-size: clamp(36px, 5vw, 54px); }
.page-hero p { max-width: 760px; font-size: 17px; color: var(--ink-600); }
.split-layout { display: grid; grid-template-columns: 1fr 440px; gap: 54px; align-items: start; }

/* Forms */
.form-card { border: 1px solid var(--line-200); border-radius: 14px; background: #fff; padding: 24px; box-shadow: var(--shadow-xs); }
.form-card h2, .form-card h3 { margin-top: 0; color: var(--brand-950); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.field { display: grid; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 700; color: var(--ink-700); }
.field-hint { font-size: 12px; color: var(--ink-500); }
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--line-300);
  border-radius: 8px;
  background: #fff;
  color: var(--ink-900);
  padding: 10px 12px;
  min-height: 42px;
}
.textarea { min-height: 106px; resize: vertical; }
.checkbox { display: flex; gap: 9px; align-items: flex-start; color: var(--ink-600); font-size: 13px; }
.checkbox input { margin-top: 3px; }
.form-error { color: var(--danger-700); font-size: 12px; }

/* Login */
.auth-page { min-height: 100vh; display: grid; grid-template-columns: 1.02fr .98fr; background: #fff; }
.auth-side { position: relative; overflow: hidden; padding: 54px; display: flex; flex-direction: column; justify-content: space-between; background: var(--brand-950); color: #fff; }
.auth-side::after { content:""; position:absolute; width:500px; height:500px; border-radius:50%; right:-260px; bottom:-180px; border:90px solid rgba(59,130,246,.16); }
.auth-side .brand { color: #fff; }
.auth-side .brand-mark::before { background: #fff; }
.auth-side h1 { max-width: 520px; margin: 0; font-size: 48px; line-height: 1.12; letter-spacing: -.045em; }
.auth-side p { max-width: 490px; color: #b7c7dc; font-size: 17px; }
.auth-workflow { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.auth-workflow span { padding: 7px 10px; border-radius: 6px; background: rgba(255,255,255,.1); font-size: 12px; }
.auth-workflow i { color: #7db2ff; font-style: normal; }
.auth-main { display: grid; place-items: center; padding: 40px; }
.auth-card { width: min(100%, 440px); }
.auth-card h2 { margin: 0 0 8px; font-size: 30px; color: var(--brand-950); letter-spacing: -.03em; }
.auth-card > p { margin: 0 0 26px; color: var(--ink-500); }
.demo-accounts { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line-200); }
.demo-accounts h3 { margin: 0 0 10px; font-size: 13px; color: var(--ink-700); }
.demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.demo-account { text-align: left; padding: 10px; border: 1px solid var(--line-200); border-radius: 8px; background: #fff; }
.demo-account:hover { border-color: #93b7ea; background: var(--primary-50); }
.demo-account strong { display: block; color: var(--brand-900); font-size: 12px; }
.demo-account small { color: var(--ink-500); font-size: 10px; }

/* App shell */
.app-layout { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; background: var(--page); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid #18365f; background: var(--brand-950); color: #fff; z-index: 110; }
.sidebar-head { height: var(--topbar); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,.11); }
.sidebar .brand { color: #fff; }
.sidebar .brand-mark::before { background: #fff; }
.sidebar .brand-copy small { color: #91a6c3; }
.sidebar-nav { padding: 18px 12px; display: grid; gap: 4px; overflow-y: auto; }
.nav-group-label { margin: 16px 10px 5px; color: #7790b1; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.sidebar-link { min-height: 42px; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 7px; color: #c7d4e6; font-size: 13px; font-weight: 650; }
.sidebar-link:hover { color: #fff; background: rgba(255,255,255,.07); }
.sidebar-link.active { color: #fff; background: #1d4f91; box-shadow: inset 3px 0 #75adff; }
.nav-glyph { width: 23px; height: 23px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; font-size: 10px; font-weight: 900; }
.sidebar-foot { margin-top: auto; padding: 14px; border-top: 1px solid rgba(255,255,255,.11); }
.sidebar-user { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 9px; }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #dbeafe; color: var(--brand-900); font-weight: 850; }
.sidebar-user strong { display: block; font-size: 12px; }
.sidebar-user small { display: block; color: #91a6c3; font-size: 10px; }

.app-column { min-width: 0; }
.topbar { height: var(--topbar); position: sticky; top: 0; z-index: 80; display: flex; align-items: center; gap: 16px; padding: 0 26px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line-200); backdrop-filter: blur(10px); }
.topbar-title { min-width: 0; }
.topbar-title strong { display: block; color: var(--brand-950); }
.topbar-title small { display: block; color: var(--ink-500); font-size: 11px; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.mobile-sidebar-toggle { display: none; }
.app-main { padding: 26px; }
.app-container { max-width: 1440px; margin: 0 auto; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
.page-heading h1 { margin: 0; color: var(--brand-950); font-size: 28px; letter-spacing: -.035em; }
.page-heading p { margin: 5px 0 0; color: var(--ink-500); }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card { min-height: 126px; padding: 18px; border: 1px solid var(--line-200); border-radius: 11px; background: #fff; box-shadow: var(--shadow-xs); }
.kpi-top { display: flex; justify-content: space-between; gap: 8px; }
.kpi-label { color: var(--ink-500); font-size: 12px; font-weight: 650; }
.kpi-value { display: block; margin: 12px 0 5px; color: var(--brand-950); font-size: 31px; line-height: 1; letter-spacing: -.045em; }
.kpi-caption { color: var(--ink-400); font-size: 11px; }
.kpi-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--primary-50); color: var(--primary-700); font-size: 11px; font-weight: 900; }
.kpi-card.success .kpi-icon { background: var(--success-50); color: var(--success-700); }
.kpi-card.warning .kpi-icon { background: var(--warning-50); color: var(--warning-700); }
.kpi-card.danger .kpi-icon { background: var(--danger-50); color: var(--danger-700); }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(310px, .75fr); gap: 18px; }
.panel { border: 1px solid var(--line-200); border-radius: 11px; background: #fff; box-shadow: var(--shadow-xs); overflow: hidden; }
.panel-head { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 17px; border-bottom: 1px solid var(--line-100); }
.panel-head h2, .panel-head h3 { margin: 0; color: var(--brand-950); font-size: 15px; }
.panel-body { padding: 17px; }
.panel-blank { padding: 42px 20px; text-align: center; color: var(--ink-500); }
.panel-blank strong { display: block; color: var(--ink-700); margin-bottom: 4px; }

/* Tables */
.table-wrap { width: 100%; overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
.data-table th { padding: 11px 13px; text-align: left; color: var(--ink-500); background: #f8fafc; border-bottom: 1px solid var(--line-200); font-size: 11px; text-transform: uppercase; letter-spacing: .035em; white-space: nowrap; }
.data-table td { padding: 12px 13px; border-bottom: 1px solid var(--line-100); color: var(--ink-700); vertical-align: middle; }
.data-table tbody tr:hover { background: #fbfdff; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.cell-primary { color: var(--ink-900); font-weight: 700; }
.cell-sub { display: block; margin-top: 2px; color: var(--ink-400); font-size: 11px; }
.table-actions { display: flex; justify-content: flex-end; gap: 6px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-100); background: #fff; }
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search-box { position: relative; }
.search-box input { min-width: 240px; padding-left: 34px; }
.search-box::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-53%); color: var(--ink-400); font-size: 18px; }

.badge { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 750; white-space: nowrap; }
.badge-neutral { background: #f1f5f9; color: var(--ink-600); }
.badge-blue { background: var(--primary-100); color: var(--primary-700); }
.badge-green { background: var(--success-100); color: var(--success-700); }
.badge-amber { background: var(--warning-100); color: var(--warning-700); }
.badge-red { background: var(--danger-100); color: var(--danger-700); }
.badge-violet { background: var(--violet-100); color: var(--violet-700); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* Charts and activity */
.bar-chart { height: 225px; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 14px; padding: 20px 4px 0; }
.bar-item { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
.bar-stack { width: 100%; max-width: 36px; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 5px 5px 2px 2px; overflow: hidden; background: var(--line-100); }
.bar-a { background: #7eb2fb; }
.bar-b { background: var(--brand-800); }
.bar-label { color: var(--ink-400); font-size: 10px; }
.activity-list { display: grid; }
.activity-item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line-100); }
.activity-item:last-child { border-bottom: 0; }
.activity-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--primary-50); color: var(--primary-700); font-size: 10px; font-weight: 900; }
.activity-item strong { font-size: 12px; }
.activity-item p { margin: 2px 0 0; color: var(--ink-500); font-size: 11px; }
.activity-item time { color: var(--ink-400); font-size: 10px; }

/* Attendance */
.attendance-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.summary-chip { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--line-200); border-radius: 8px; background: #fff; color: var(--ink-600); font-size: 12px; }
.summary-chip strong { color: var(--ink-900); }
.attendance-control { display: inline-flex; padding: 3px; border: 1px solid var(--line-200); border-radius: 8px; background: #f8fafc; }
.attendance-control button { min-width: 68px; min-height: 31px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-500); font-size: 11px; font-weight: 750; }
.attendance-control button.active-present { background: var(--success-100); color: var(--success-700); }
.attendance-control button.active-absent { background: var(--danger-100); color: var(--danger-700); }
.sticky-save { position: sticky; bottom: 14px; margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 15px; border: 1px solid #bfdbfe; border-radius: 10px; background: rgba(255,255,255,.96); box-shadow: var(--shadow-sm); }

/* Student learning */
.assignment-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.assignment-card { padding: 17px; border: 1px solid var(--line-200); border-radius: 11px; background: #fff; }
.assignment-card.overdue { border-left: 4px solid var(--danger-600); }
.assignment-card.completed { border-left: 4px solid var(--success-600); }
.assignment-card h3 { margin: 10px 0 5px; font-size: 16px; color: var(--brand-950); }
.assignment-meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--ink-500); font-size: 11px; }
.progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: #e8edf4; }
.progress-fill { height: 100%; border-radius: inherit; background: var(--primary-600); transition: width .2s ease; }
.progress-fill.success { background: var(--success-600); }
.lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
.video-player { overflow: hidden; border-radius: 11px; border: 1px solid #203854; background: #071629; color: #fff; }
.video-screen { position: relative; min-height: 390px; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #173967, #071629 70%); }
.video-screen::after { content:""; position:absolute; inset:0; background: linear-gradient(135deg, rgba(255,255,255,.04), transparent 40%); }
.play-button { position: relative; z-index: 1; width: 68px; height: 68px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.42); background: rgba(255,255,255,.1); color: #fff; font-size: 24px; }
.watermark { position: absolute; z-index: 2; top: 22px; right: 24px; padding: 5px 8px; border-radius: 4px; background: rgba(0,0,0,.34); color: rgba(255,255,255,.8); font-size: 10px; }
.video-caption { position: absolute; z-index: 2; left: 24px; bottom: 24px; }
.video-caption strong { display: block; font-size: 17px; }
.video-caption small { color: #adbed5; }
.video-controls { padding: 13px 15px; background: #0b203b; }
.video-control-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.video-control-row small { color: #a8bad0; }
.lesson-outline { align-self: start; }
.outline-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line-100); }
.outline-index { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: var(--primary-50); color: var(--primary-700); font-size: 10px; font-weight: 800; }

/* Quiz */
.quiz-shell { max-width: 960px; margin: 0 auto; }
.quiz-header { position: sticky; top: calc(var(--topbar) + 8px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 13px 16px; border: 1px solid var(--line-200); border-radius: 10px; background: rgba(255,255,255,.96); box-shadow: var(--shadow-xs); }
.quiz-progress { display: flex; align-items: center; gap: 10px; flex: 1; }
.quiz-progress .progress-track { width: min(260px, 42vw); }
.timer { padding: 7px 10px; border-radius: 7px; background: var(--warning-50); color: var(--warning-700); font-weight: 800; font-variant-numeric: tabular-nums; }
.question-card { margin-bottom: 14px; padding: 20px; border: 1px solid var(--line-200); border-radius: 10px; background: #fff; }
.question-card h3 { margin: 0 0 14px; font-size: 15px; color: var(--ink-900); }
.question-index { color: var(--primary-700); }
.option-list { display: grid; gap: 8px; }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--line-200); border-radius: 8px; color: var(--ink-700); }
.option:hover { border-color: #a8c5ec; background: var(--primary-50); }
.option input { margin-top: 3px; }
.result-hero { padding: 25px; border: 1px solid var(--line-200); border-radius: 12px; background: #fff; text-align: center; }
.score-ring { width: 116px; height: 116px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--success-600) var(--score), #e8edf4 0); position: relative; }
.score-ring::after { content:""; position:absolute; width:88px; height:88px; border-radius:50%; background:#fff; }
.score-ring strong { position: relative; z-index: 1; font-size: 25px; color: var(--brand-950); }

/* Content studio */
.content-grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
.course-tree { border: 1px solid var(--line-200); border-radius: 10px; background: #fff; padding: 14px; }
.tree-item { padding: 8px 9px; border-radius: 6px; color: var(--ink-600); font-size: 12px; }
.tree-item.level-1 { font-weight: 800; color: var(--brand-900); }
.tree-item.level-2 { margin-left: 14px; }
.tree-item.level-3 { margin-left: 28px; }
.tree-item.active { background: var(--primary-50); color: var(--primary-700); }
.editor-canvas { border: 1px solid var(--line-200); border-radius: 10px; background: #fff; padding: 22px; }
.editor-block { padding: 16px; border: 1px dashed var(--line-300); border-radius: 8px; background: #fbfcfe; }
.question-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.question-type { padding: 11px; border: 1px solid var(--line-200); border-radius: 7px; background: #fff; color: var(--ink-700); font-size: 11px; font-weight: 650; }

/* Alerts, states, toast */
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line-200); background: #fff; color: var(--ink-700); font-size: 13px; }
.alert-info { border-color: #bfdbfe; background: var(--primary-50); color: #1e4f91; }
.alert-success { border-color: #bbf7d0; background: var(--success-50); color: var(--success-700); }
.alert-warning { border-color: #fde68a; background: var(--warning-50); color: var(--warning-700); }
.alert-danger { border-color: #fecaca; background: var(--danger-50); color: var(--danger-700); }
.empty-state { padding: 54px 20px; text-align: center; }
.empty-icon { width: 52px; height: 52px; margin: 0 auto 13px; display: grid; place-items: center; border-radius: 12px; background: var(--primary-50); color: var(--primary-700); font-weight: 900; }
.empty-state h3 { margin: 0 0 6px; color: var(--brand-950); }
.empty-state p { margin: 0 auto 16px; max-width: 430px; color: var(--ink-500); }
.toast-root { position: fixed; right: 18px; top: 18px; z-index: 2200; display: grid; gap: 10px; width: min(380px, calc(100% - 36px)); }
.toast { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 13px 14px; border: 1px solid var(--line-200); border-left: 4px solid var(--primary-600); border-radius: 8px; background: #fff; box-shadow: var(--shadow-md); animation: toastIn .18s ease-out; }
.toast.success { border-left-color: var(--success-600); }
.toast.error { border-left-color: var(--danger-600); }
.toast strong { display: block; font-size: 13px; }
.toast p { margin: 2px 0 0; color: var(--ink-500); font-size: 11px; }
.toast button { border: 0; background: transparent; color: var(--ink-400); }
@keyframes toastIn { from { opacity:0; transform: translateY(-8px); } }

.permission-page { min-height: 100vh; display: grid; place-items: center; padding: 30px; background: var(--page); }
.permission-card { width: min(100%, 520px); text-align: center; padding: 42px; border: 1px solid var(--line-200); border-radius: 14px; background: #fff; }
.permission-code { font-size: 68px; font-weight: 900; letter-spacing: -.06em; color: var(--line-300); }

/* Responsive */
@media (max-width: 1100px) {
  .public-nav { gap: 15px; }
  .public-nav a:nth-child(4), .public-nav a:nth-child(5) { display: none; }
  .hero-grid { gap: 34px; }
  .preview-badge { right: 14px; bottom: 14px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .dashboard-grid { grid-template-columns: 1fr; }
  .split-layout { grid-template-columns: 1fr 390px; }
}

@media (max-width: 900px) {
  .public-nav, .public-actions .btn-primary { display: none; }
  .public-nav.open { position: absolute; left: 0; right: 0; top: 72px; display: grid; gap: 0; padding: 12px 20px 18px; background: #fff; border-bottom: 1px solid var(--line-200); box-shadow: var(--shadow-sm); }
  .public-nav.open a { padding: 10px 0; display: block; }
  .mobile-menu-btn { display: inline-grid; }
  .hero-grid { grid-template-columns: 1fr; padding: 62px 0; }
  .product-preview { max-width: 620px; }
  .audience-grid, .program-grid { grid-template-columns: 1fr; }
  .workflow { grid-template-columns: 1fr; gap: 16px; }
  .workflow-step { display: grid; grid-template-columns: 52px 1fr; gap: 14px; text-align: left; padding: 0; align-items: center; }
  .workflow-step:not(:last-child)::after { top: 52px; left: 25px; height: 18px; width: 0; border-top: 0; border-left: 1px dashed #a7b8cc; }
  .workflow-number { margin: 0; }
  .feature-grid { grid-template-columns: repeat(2, 1fr); }
  .metric-row { grid-template-columns: repeat(2, 1fr); }
  .metric:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-200); }
  .metric:nth-child(4) { border-top: 1px solid var(--line-200); }
  .public-cta { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .split-layout { grid-template-columns: 1fr; }

  .app-layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; transform: translateX(-102%); transition: .2s ease; width: var(--sidebar); box-shadow: var(--shadow-md); }
  .sidebar.open { transform: translateX(0); }
  .mobile-sidebar-toggle { display: inline-grid; }
  .app-main { padding: 20px; }
  .lesson-layout, .content-grid { grid-template-columns: 1fr; }
  .video-screen { min-height: 320px; }
}

@media (max-width: 680px) {
  .container { width: min(calc(100% - 28px), var(--container)); }
  .public-header { height: 64px; }
  .public-nav.open { top: 64px; }
  .public-actions .btn-secondary { min-height: 36px; padding: 7px 10px; }
  .hero-grid { padding: 48px 0 54px; }
  .hero h1, .page-hero h1 { font-size: 38px; }
  .hero p { font-size: 16px; }
  .preview-app { grid-template-columns: 86px 1fr; min-height: 310px; }
  .preview-main { padding: 13px; }
  .preview-kpis { grid-template-columns: repeat(2, 1fr); }
  .preview-kpi:last-child { display: none; }
  .preview-chart { height: 94px; }
  .preview-badge { display: none; }
  .section { padding: 58px 0; }
  .feature-grid, .form-grid, .footer-grid { grid-template-columns: 1fr; }
  .metric-row { grid-template-columns: 1fr 1fr; }
  .public-cta { padding: 25px; }
  .footer-bottom { flex-direction: column; }

  .auth-page { grid-template-columns: 1fr; }
  .auth-side { min-height: 290px; padding: 30px 24px; }
  .auth-side h1 { font-size: 35px; }
  .auth-side p { font-size: 14px; }
  .auth-main { padding: 30px 20px; }

  .topbar { padding: 0 14px; }
  .topbar-title small { display: none; }
  .app-main { padding: 14px; }
  .page-heading { align-items: stretch; flex-direction: column; }
  .page-heading .inline { width: 100%; }
  .page-heading .btn { flex: 1; }
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .kpi-card { min-height: 112px; padding: 14px; }
  .kpi-value { font-size: 26px; }
  .assignment-grid { grid-template-columns: 1fr; }
  .toolbar { align-items: stretch; flex-direction: column; }
  .toolbar-left, .toolbar-right, .search-box, .search-box input { width: 100%; }
  .toolbar .btn, .toolbar select { flex: 1; }
  .data-table { min-width: 720px; }
  .data-table.mobile-cards { min-width: 0; }
  .data-table.mobile-cards thead { display: none; }
  .data-table.mobile-cards, .data-table.mobile-cards tbody, .data-table.mobile-cards tr, .data-table.mobile-cards td { display: block; width: 100%; }
  .data-table.mobile-cards tr { padding: 14px; border-bottom: 1px solid var(--line-200); }
  .data-table.mobile-cards td { padding: 5px 0; border: 0; }
  .data-table.mobile-cards td[data-label]::before { content: attr(data-label); display: block; color: var(--ink-400); font-size: 10px; text-transform: uppercase; }
  .attendance-control button { min-width: 58px; }
  .sticky-save { bottom: 8px; flex-direction: column; align-items: stretch; }
  .video-screen { min-height: 230px; }
  .video-caption { left: 16px; bottom: 16px; }
  .watermark { right: 14px; top: 14px; }
  .quiz-header { top: calc(var(--topbar) + 3px); align-items: flex-start; flex-direction: column; }
  .quiz-progress, .quiz-progress .progress-track { width: 100%; }
  .question-type-grid { grid-template-columns: 1fr 1fr; }
  .demo-grid { grid-template-columns: 1fr; }
}

@media print {
  .sidebar, .topbar, .page-heading .btn, .toolbar, .toast-root { display: none !important; }
  .app-layout { display: block; }
  .app-main { padding: 0; }
  body { background: #fff; }
  .panel, .kpi-card { box-shadow: none; break-inside: avoid; }
}

/* PO review v1.1 — additional product surfaces */
.resource-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.resource-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  min-height: 210px;
  padding: 22px;
  border: 1px solid var(--line-200);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.resource-card h2,
.resource-card h3 { margin: 0; color: var(--brand-950); }
.resource-card h2 { font-size: 20px; }
.resource-card h3 { font-size: 18px; }
.resource-card p { margin: 0; color: var(--ink-500); line-height: 1.65; }
.resource-card .between { width: 100%; margin-top: auto; }
.resource-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--ink-500); font-size: 13px; }
.resource-card.event-card { padding-left: 88px; }
.event-date {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 54px;
  min-height: 62px;
  border-radius: 10px;
  background: var(--brand-50);
  color: var(--brand-900);
}
.resource-card.event-card .event-date { position: absolute; left: 20px; top: 22px; }
.event-date strong { font-size: 24px; line-height: 1; }
.event-date small { margin-top: 4px; font-weight: 800; }

.support-widget { position: fixed; right: 22px; bottom: 22px; z-index: 1200; }
.support-trigger {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 16px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: var(--brand-900);
  box-shadow: var(--shadow-md);
  cursor: pointer;
}
.support-trigger span { display: grid; place-items: center; width: 23px; height: 23px; border: 1px solid rgba(255,255,255,.45); border-radius: 50%; }
.support-panel {
  display: none;
  position: absolute;
  right: 0;
  bottom: 58px;
  width: min(390px, calc(100vw - 28px));
  padding: 20px;
  border: 1px solid var(--line-200);
  border-radius: var(--radius-lg);
  background: #fff;
  box-shadow: 0 24px 64px rgba(8, 27, 57, .2);
}
.support-widget.open .support-panel { display: block; }
.support-panel .stack { margin-top: 18px; }

.course-overview {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
  margin-bottom: 18px;
  padding: 24px;
  border: 1px solid var(--line-200);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #fff, var(--brand-50));
}
.course-overview h2 { margin: 6px 0; color: var(--brand-950); }
.course-overview p { max-width: 720px; margin: 0; color: var(--ink-500); }
.course-stat { min-width: 110px; padding-left: 22px; border-left: 1px solid var(--line-200); text-align: center; }
.course-stat strong { display: block; color: var(--brand-900); font-size: 34px; }
.course-stat span { color: var(--ink-500); font-size: 13px; }
.lesson-list { overflow: hidden; border: 1px solid var(--line-200); border-radius: var(--radius-lg); background: #fff; }
.lesson-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  min-height: 88px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--line-100);
}
.lesson-row:last-child { border-bottom: 0; }
.lesson-order { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--brand-50); color: var(--brand-900); font-weight: 800; }
.lesson-copy strong { display: block; color: var(--ink-900); }
.lesson-copy > span { display: block; margin: 4px 0 7px; color: var(--ink-500); font-size: 13px; }
.lesson-action { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

.integration-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.integration-card { min-height: 150px; padding: 18px; border: 1px solid var(--line-200); border-radius: var(--radius-lg); background: #fff; }
.integration-card p { margin: 12px 0 0; color: var(--ink-500); font-size: 13px; line-height: 1.55; }
.copy-field { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }

button:disabled,
.btn:disabled,
.icon-btn:disabled { cursor: not-allowed; opacity: .48; }

@media (max-width: 1023px) {
  .resource-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .integration-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 680px) {
  .resource-grid,
  .integration-grid { grid-template-columns: 1fr; }
  .resource-card { min-height: 0; }
  .support-widget { right: 14px; bottom: 14px; }
  .support-trigger strong { display: none; }
  .support-trigger { width: 48px; min-height: 48px; padding: 0; justify-content: center; }
  .support-panel { right: 0; bottom: 58px; max-height: calc(100vh - 90px); overflow: auto; }
  .course-overview { grid-template-columns: 1fr; }
  .course-stat { padding: 14px 0 0; border-top: 1px solid var(--line-200); border-left: 0; text-align: left; }
  .lesson-row { grid-template-columns: 42px minmax(0,1fr); align-items: start; }
  .lesson-action { grid-column: 1 / -1; justify-content: flex-start; padding-left: 58px; }
  .copy-field { grid-template-columns: 1fr; }
}

/* ===========================================================================
   INTERNATIONAL MINIMAL UI — v2.0
   Visual refresh only. Business flows, data relationships and interactions
   remain unchanged from v1.1.
   ========================================================================== */

:root {
  --brand-950: #101114;
  --brand-900: #17191d;
  --brand-800: #25282e;
  --brand-700: #343840;
  --primary-700: #114ec9;
  --primary-600: #155eef;
  --primary-500: #3578f6;
  --primary-100: #dce8ff;
  --primary-50: #eef4ff;
  --success-700: #067647;
  --success-600: #079455;
  --success-100: #d9f5e8;
  --success-50: #f0fbf5;
  --warning-700: #934b08;
  --warning-600: #b65d09;
  --warning-100: #ffead5;
  --warning-50: #fff8f0;
  --danger-700: #b42318;
  --danger-600: #d92d20;
  --danger-100: #fee4e2;
  --danger-50: #fff4f3;
  --violet-700: #5741b5;
  --violet-100: #ebe7ff;
  --ink-950: #101114;
  --ink-900: #1b1d21;
  --ink-700: #3d4149;
  --ink-600: #565b64;
  --ink-500: #717782;
  --ink-400: #979da7;
  --line-300: #d0d2d5;
  --line-200: #e2e3e5;
  --line-100: #eeeff0;
  --surface: #ffffff;
  --page: #f7f7f5;
  --page-warm: #f3f2ee;
  --shadow-xs: 0 1px 2px rgba(16, 17, 20, .035);
  --shadow-sm: 0 4px 14px rgba(16, 17, 20, .055);
  --shadow-md: 0 18px 48px rgba(16, 17, 20, .09);
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 10px;
  --radius-xl: 12px;
  --sidebar: 240px;
  --topbar: 64px;
  --container: 1240px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

html { background: var(--page); }
body {
  background: var(--page);
  color: var(--ink-900);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: -.006em;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { letter-spacing: inherit; }
.container { width: min(calc(100% - 48px), var(--container)); }

/* Wordmark */
.brand { gap: 9px; color: var(--brand-950); font-weight: 650; letter-spacing: -.025em; }
.brand-mark {
  width: 26px;
  height: 26px;
  border: 1px solid currentColor;
  border-radius: 5px;
  color: inherit;
}
.brand-mark::before {
  content: "Y";
  inset: 0;
  width: auto;
  height: auto;
  display: grid;
  place-items: center;
  background: transparent !important;
  clip-path: none;
  color: currentColor;
  font-size: 13px;
  font-weight: 750;
}
.brand-mark::after {
  content: "";
  left: auto;
  top: auto;
  right: -2px;
  bottom: -2px;
  width: 6px;
  height: 6px;
  border: 2px solid var(--surface);
  border-radius: 50%;
  background: var(--primary-600);
}
.brand-copy strong { font-size: 15px; font-weight: 700; }
.brand-copy small { margin-top: 3px; color: var(--ink-500); font-size: 8px; font-weight: 650; letter-spacing: .14em; }

/* Controls */
.btn {
  min-height: 40px;
  padding: 9px 14px;
  border-radius: 5px;
  font-weight: 650;
  font-size: 13px;
  transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease, box-shadow 130ms ease;
}
.btn:hover, .btn:active { transform: none; }
.btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid rgba(21, 94, 239, .3);
  outline-offset: 2px;
}
.btn-primary { background: var(--brand-950); box-shadow: none; }
.btn-primary:hover { background: #292c31; }
.btn-blue { background: var(--primary-600); }
.btn-blue:hover { background: var(--primary-700); }
.btn-secondary { color: var(--ink-900); border-color: var(--line-300); }
.btn-secondary:hover { border-color: #a8acb3; background: #fafafa; }
.btn-ghost:hover { background: #efefed; }
.btn-sm { min-height: 34px; padding: 6px 10px; font-size: 12px; }
.btn-lg { min-height: 46px; padding: 11px 17px; font-size: 14px; }
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 5px;
  border-color: var(--line-200);
  color: var(--ink-600);
  box-shadow: none;
}
.icon-btn:hover { color: var(--ink-950); border-color: var(--line-300); background: #fafafa; }

/* Public website */
.public-page { background: #fff; }
.public-header {
  height: 70px;
  background: rgba(255, 255, 255, .97);
  border-bottom-color: var(--line-200);
  backdrop-filter: blur(16px);
}
.public-header-inner { gap: 30px; }
.public-nav { gap: 25px; color: var(--ink-600); font-size: 12px; font-weight: 600; }
.public-nav a { position: relative; padding: 25px 0 23px; }
.public-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: -1px;
  height: 1px;
  background: var(--ink-950);
  transition: right 150ms ease;
}
.public-nav a:hover, .public-nav a.active { color: var(--ink-950); }
.public-nav a:hover::after, .public-nav a.active::after { right: 0; }
.public-actions { gap: 7px; }

.hero {
  overflow: visible;
  background: #fff;
  border-bottom: 1px solid var(--line-200);
}
.hero::before { display: none; }
.hero-grid { gap: 72px; padding: 104px 0 100px; }
.eyebrow {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink-500);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
}
.hero h1, .page-hero h1 {
  margin: 22px 0 22px;
  color: var(--ink-950);
  font-size: clamp(48px, 5.4vw, 72px);
  line-height: 1.01;
  letter-spacing: -.058em;
  font-weight: 650;
}
.hero h1 span { color: var(--primary-600); }
.hero p { max-width: 610px; margin-bottom: 32px; color: var(--ink-600); font-size: 17px; line-height: 1.65; }
.hero-proof { margin-top: 28px; gap: 20px; color: var(--ink-600); font-size: 12px; }
.check-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: transparent;
  color: var(--success-700);
  border: 1px solid #a8d9c1;
  font-size: 9px;
}

.product-preview {
  border: 1px solid var(--line-300);
  border-radius: 9px;
  background: #fff;
  box-shadow: 0 24px 70px rgba(16, 17, 20, .095);
  transform: none;
}
.product-console { overflow: hidden; }
.console-top {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--line-200);
  color: var(--ink-500);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .11em;
}
.console-live { display: inline-flex; align-items: center; gap: 7px; }
.console-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--success-600); box-shadow: 0 0 0 4px var(--success-50); }
.console-headline { padding: 26px 24px 22px; border-bottom: 1px solid var(--line-100); }
.console-headline small { display: block; color: var(--ink-400); font-size: 9px; font-weight: 700; letter-spacing: .14em; }
.console-headline strong { display: block; max-width: 430px; margin-top: 9px; color: var(--ink-950); font-size: 23px; line-height: 1.25; letter-spacing: -.035em; font-weight: 650; }
.console-rows { display: grid; }
.console-row {
  min-height: 80px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 13px;
  padding: 15px 24px;
  border-bottom: 1px solid var(--line-100);
}
.console-index { color: var(--ink-400); font-size: 10px; font-variant-numeric: tabular-nums; }
.console-row strong { display: block; color: var(--ink-900); font-size: 13px; font-weight: 650; }
.console-row small { display: block; margin-top: 4px; color: var(--ink-500); font-size: 11px; }
.console-state {
  min-width: 70px;
  padding: 5px 7px;
  border: 1px solid var(--line-200);
  border-radius: 4px;
  color: var(--ink-600);
  background: #fafafa;
  font-size: 9px;
  font-weight: 700;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.console-state.success { border-color: #b7dfca; color: var(--success-700); background: var(--success-50); }
.console-footer { display: grid; grid-template-columns: repeat(3, 1fr); background: #fafaf9; }
.console-footer div { padding: 17px 20px; border-right: 1px solid var(--line-200); }
.console-footer div:last-child { border-right: 0; }
.console-footer strong { display: block; color: var(--ink-950); font-size: 20px; font-weight: 650; letter-spacing: -.035em; }
.console-footer span { color: var(--ink-500); font-size: 10px; }

.section { padding: 92px 0; }
.section-soft, .section-warm { background: var(--page); border-color: var(--line-200); }
.section-head { max-width: 760px; margin-bottom: 40px; }
.section-head h2 { margin: 12px 0 13px; color: var(--ink-950); font-size: clamp(30px, 4vw, 46px); line-height: 1.12; letter-spacing: -.047em; font-weight: 630; }
.section-head p { color: var(--ink-600); font-size: 15px; line-height: 1.65; }

.audience-grid { gap: 0; border: 1px solid var(--line-200); border-radius: 9px; overflow: hidden; }
.audience-card {
  min-height: 320px;
  padding: 34px;
  border: 0;
  border-radius: 0;
  background: #fff;
  box-shadow: none;
}
.audience-card + .audience-card { border-left: 1px solid var(--line-200); }
.audience-card::after { display: none; }
.audience-icon {
  width: auto;
  height: auto;
  display: inline-block;
  border-radius: 0;
  background: transparent !important;
  color: var(--primary-600) !important;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .12em;
}
.audience-card.b2b .audience-icon { color: var(--violet-700) !important; }
.audience-card h3 { margin: 23px 0 10px; color: var(--ink-950); font-size: 26px; font-weight: 630; letter-spacing: -.035em; }
.audience-card p { color: var(--ink-600); line-height: 1.65; }
.audience-card ul { gap: 10px; margin: 24px 0 28px; }
.audience-card li { color: var(--ink-700); font-size: 13px; }

.workflow { border-top: 1px solid var(--line-300); }
.workflow-step { padding: 22px 18px 0; text-align: left; }
.workflow-step:first-child { padding-left: 0; }
.workflow-step:last-child { padding-right: 0; }
.workflow-step:not(:last-child)::after { display: none; }
.workflow-number {
  width: auto;
  height: auto;
  margin: 0 0 22px;
  display: inline-block;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: var(--primary-600);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  letter-spacing: .08em;
}
.workflow-step h3 { color: var(--ink-950); font-size: 14px; font-weight: 650; }
.workflow-step p { color: var(--ink-500); font-size: 11px; line-height: 1.6; }

.feature-grid { gap: 12px; }
.feature-card { padding: 24px; border-color: var(--line-200); border-radius: 7px; box-shadow: none; }
.feature-icon {
  width: auto;
  height: auto;
  display: inline-block;
  border-radius: 0;
  background: transparent;
  color: var(--ink-400);
  font-size: 9px;
  letter-spacing: .12em;
}
.feature-card h3 { margin: 22px 0 8px; color: var(--ink-950); font-size: 15px; font-weight: 650; }
.feature-card p { color: var(--ink-500); font-size: 12px; line-height: 1.6; }
.metric-row { border-radius: 7px; }
.metric { padding: 27px 22px; text-align: left; }
.metric strong { color: var(--ink-950); font-size: 32px; font-weight: 630; }
.metric small { font-size: 11px; }

.program-grid { gap: 12px; }
.program-card { border-radius: 7px; box-shadow: none; }
.program-cover,
.program-card:nth-child(2) .program-cover,
.program-card:nth-child(3) .program-cover {
  min-height: 116px;
  padding: 22px;
  background: #f4f4f1;
  color: var(--ink-950);
  border-bottom: 1px solid var(--line-200);
}
.program-card:nth-child(1) { border-top: 2px solid var(--primary-600); }
.program-card:nth-child(2) { border-top: 2px solid var(--violet-700); }
.program-card:nth-child(3) { border-top: 2px solid var(--success-700); }
.program-cover strong { font-size: 19px; font-weight: 630; }
.program-body { padding: 20px 22px 22px; }
.public-cta { padding: 34px 38px; border-radius: 8px; background: var(--ink-950); }
.public-cta h2 { font-size: 25px; font-weight: 630; letter-spacing: -.03em; }
.public-footer { background: #111214; }
.page-hero { padding: 78px 0 58px; background: #fafaf9; border-color: var(--line-200); }
.page-hero h1 { font-size: clamp(40px, 5vw, 60px); }
.page-hero p { color: var(--ink-600); line-height: 1.65; }

/* Forms and public content */
.form-card { border-radius: 7px; box-shadow: none; }
.form-card h2, .form-card h3 { color: var(--ink-950); font-weight: 630; }
.field label { color: var(--ink-700); font-size: 12px; font-weight: 650; }
.input, .select, .textarea {
  min-height: 42px;
  border-radius: 5px;
  border-color: var(--line-300);
  color: var(--ink-950);
  box-shadow: none;
}
.input:hover, .select:hover, .textarea:hover { border-color: #b9bcc2; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary-600); }
.resource-grid { gap: 12px; }
.resource-card { min-height: 200px; padding: 23px; border-radius: 7px; box-shadow: none; }
.resource-card h2, .resource-card h3 { color: var(--ink-950); font-weight: 630; }
.event-date { border-radius: 5px; background: #f1f1ef; color: var(--ink-900); }
.support-trigger {
  min-height: 42px;
  padding: 8px 13px;
  border-radius: 6px;
  background: var(--ink-950);
  box-shadow: 0 8px 24px rgba(16, 17, 20, .14);
}
.support-panel { border-radius: 8px; box-shadow: 0 20px 55px rgba(16, 17, 20, .15); }
.course-overview { border-radius: 7px; background: #fff; }
.lesson-list { border-radius: 7px; }
.lesson-order { border-radius: 5px; background: #f1f1ef; color: var(--ink-700); }
.integration-card { border-radius: 7px; }

/* Authentication */
.auth-page { background: #fff; }
.auth-side { padding: 56px 64px; background: #121316; }
.auth-side::after { display: none; }
.auth-side h1 { max-width: 560px; font-size: clamp(42px, 5vw, 62px); font-weight: 620; line-height: 1.04; }
.auth-side p { color: #aeb2ba; line-height: 1.65; }
.auth-workflow { gap: 0; border: 1px solid #35373d; border-radius: 6px; overflow: hidden; width: max-content; max-width: 100%; }
.auth-workflow span { padding: 9px 11px; border-radius: 0; background: transparent; color: #d6d8dd; border-right: 1px solid #35373d; }
.auth-workflow span:last-child { border-right: 0; }
.auth-workflow i { display: none; }
.auth-card h2 { color: var(--ink-950); font-size: 32px; font-weight: 630; }
.demo-account { border-radius: 5px; }
.demo-account:hover { border-color: var(--line-300); background: #f7f7f5; }
.demo-account strong { color: var(--ink-900); }

/* Role-based visual system. RBAC changes accent, never semantic meaning. */
.app-layout[data-role="STUDENT"] {
  --role-accent: #155eef;
  --role-accent-strong: #114ec9;
  --role-accent-soft: #eef4ff;
  --role-accent-line: #b9d0ff;
}
.app-layout[data-role="TEACHER"] {
  --role-accent: #087f5b;
  --role-accent-strong: #056747;
  --role-accent-soft: #eaf8f2;
  --role-accent-line: #a9ddca;
}
.app-layout[data-role="TA"] {
  --role-accent: #a55b08;
  --role-accent-strong: #854605;
  --role-accent-soft: #fff6e8;
  --role-accent-line: #e9c895;
}
.app-layout[data-role="ADMIN"] {
  --role-accent: #6e56cf;
  --role-accent-strong: #5741b5;
  --role-accent-soft: #f2efff;
  --role-accent-line: #cbc2f0;
}

.app-layout { background: var(--page); }
.sidebar {
  border-right: 1px solid var(--line-200);
  background: #f4f4f1;
  color: var(--ink-900);
}
.sidebar-head {
  min-height: var(--topbar);
  padding: 0 18px;
  gap: 10px;
  border-bottom: 1px solid var(--line-200);
}
.sidebar .brand { color: var(--ink-950); }
.sidebar .brand-mark { color: var(--ink-950); }
.sidebar .brand-mark::after { border-color: #f4f4f1; background: var(--role-accent); }
.sidebar-context {
  margin-left: auto;
  padding: 4px 6px;
  border: 1px solid var(--role-accent-line);
  border-radius: 4px;
  color: var(--role-accent-strong);
  background: var(--role-accent-soft);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.sidebar-nav { padding: 16px 10px; gap: 2px; }
.nav-group-label { margin: 18px 10px 7px; color: var(--ink-400); font-size: 8px; letter-spacing: .13em; }
.sidebar-link {
  position: relative;
  min-height: 40px;
  padding: 8px 10px;
  border-radius: 5px;
  color: var(--ink-600);
  font-size: 12px;
  font-weight: 590;
}
.sidebar-link:hover { color: var(--ink-950); background: #ebebe7; }
.sidebar-link.active {
  color: var(--role-accent-strong);
  background: var(--role-accent-soft);
  box-shadow: none;
}
.sidebar-link.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 9px;
  bottom: 9px;
  width: 2px;
  border-radius: 2px;
  background: var(--role-accent);
}
.nav-glyph {
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 0;
  color: var(--ink-400);
  font-size: 0;
}
.sidebar-link:hover .nav-glyph { color: var(--ink-700); }
.sidebar-link.active .nav-glyph { color: var(--role-accent); }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--line-200); }
.sidebar-user { grid-template-columns: 32px 1fr auto; }
.sidebar-user strong { color: var(--ink-900); font-weight: 650; }
.sidebar-user small { color: var(--ink-500); }
.avatar {
  width: 32px;
  height: 32px;
  border: 1px solid var(--role-accent-line, var(--line-200));
  background: var(--role-accent-soft, #f1f1ef);
  color: var(--role-accent-strong, var(--ink-900));
  font-size: 11px;
  font-weight: 700;
}
.sidebar .icon-btn { background: transparent; }

.topbar {
  background: rgba(255, 255, 255, .96);
  border-bottom-color: var(--line-200);
  backdrop-filter: blur(16px);
}
.topbar-title strong { color: var(--ink-950); font-size: 13px; font-weight: 650; }
.topbar-title small { color: var(--ink-500); }
.role-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 8px;
  border: 1px solid var(--role-accent-line);
  border-radius: 4px;
  background: var(--role-accent-soft);
  color: var(--role-accent-strong);
  font-size: 10px;
  font-weight: 650;
}
.role-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--role-accent); }
.environment-label { color: var(--ink-400); font-size: 10px; }
.notification-pulse {
  position: absolute;
  width: 6px;
  height: 6px;
  margin: -19px 0 0 18px;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--danger-600);
}
.app-main { padding: 28px 30px 36px; }
.app-container { max-width: 1480px; }
.page-heading { margin-bottom: 24px; }
.page-heading h1 { color: var(--ink-950); font-size: 27px; font-weight: 630; letter-spacing: -.04em; }
.page-heading p { color: var(--ink-500); font-size: 13px; }

.app-layout .btn-primary, .app-layout .btn-blue { background: var(--role-accent); color: #fff; }
.app-layout .btn-primary:hover, .app-layout .btn-blue:hover { background: var(--role-accent-strong); }
.app-layout .btn-secondary:hover { border-color: var(--role-accent-line); background: var(--role-accent-soft); color: var(--role-accent-strong); }
.app-layout .progress-fill:not(.success) { background: var(--role-accent); }
.app-layout .question-index, .app-layout .outline-index { color: var(--role-accent-strong); }
.app-layout .outline-index, .app-layout .activity-icon, .app-layout .kpi-icon, .app-layout .empty-icon { background: var(--role-accent-soft); color: var(--role-accent-strong); }
.app-layout .tree-item.active { background: var(--role-accent-soft); color: var(--role-accent-strong); }

.kpi-grid { gap: 10px; margin-bottom: 18px; }
.kpi-card {
  min-height: 120px;
  padding: 18px 19px;
  border-radius: 7px;
  border-color: var(--line-200);
  box-shadow: none;
}
.kpi-label { color: var(--ink-500); font-size: 11px; font-weight: 600; }
.kpi-value { color: var(--ink-950); font-size: 30px; font-weight: 630; }
.kpi-caption { color: var(--ink-400); }
.kpi-icon {
  width: 29px;
  height: 29px;
  border: 1px solid var(--role-accent-line);
  border-radius: 5px;
  font-size: 9px;
}
.kpi-card.success .kpi-icon { border-color: #b7dfca; }
.kpi-card.warning .kpi-icon { border-color: #ebc797; }
.kpi-card.danger .kpi-icon { border-color: #f3b8b3; }
.dashboard-grid { gap: 12px; }
.panel { border-radius: 7px; border-color: var(--line-200); box-shadow: none; }
.panel-head { min-height: 56px; padding: 13px 16px; border-bottom-color: var(--line-100); }
.panel-head h2, .panel-head h3 { color: var(--ink-950); font-size: 13px; font-weight: 650; }
.panel-body { padding: 17px; }

.data-table { font-size: 12px; }
.data-table th {
  padding: 10px 12px;
  color: var(--ink-500);
  background: #fafaf9;
  border-bottom-color: var(--line-200);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .075em;
}
.data-table td { padding: 12px; color: var(--ink-700); border-bottom-color: var(--line-100); }
.data-table tbody tr:hover { background: #fafaf9; }
.cell-primary { color: var(--ink-950); font-weight: 620; }
.toolbar { padding: 12px 14px; background: #fff; }

.badge {
  min-height: 22px;
  padding: 3px 7px;
  border: 1px solid transparent;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .015em;
}
.badge-neutral { border-color: var(--line-200); background: #f6f6f4; color: var(--ink-600); }
.badge-blue { border-color: #bfd2ff; background: var(--primary-50); color: var(--primary-700); }
.badge-green { border-color: #b9e2cd; background: var(--success-50); color: var(--success-700); }
.badge-amber { border-color: #efd0a7; background: var(--warning-50); color: var(--warning-700); }
.badge-red { border-color: #f2b8b4; background: var(--danger-50); color: var(--danger-700); }
.badge-violet { border-color: #d2c8f4; background: #f4f1ff; color: var(--violet-700); }
.dot { width: 5px; height: 5px; }

.bar-chart { gap: 12px; }
.bar-stack { max-width: 28px; border-radius: 2px 2px 0 0; }
.bar-a { background: var(--role-accent-line); }
.bar-b { background: var(--role-accent-strong); }
.activity-icon { border-radius: 4px; }
.summary-chip { border-radius: 5px; }
.attendance-control { border-radius: 5px; background: #f4f4f1; }
.attendance-control button { border-radius: 3px; }
.sticky-save { border-color: var(--role-accent-line); border-radius: 7px; box-shadow: 0 8px 25px rgba(16, 17, 20, .08); }
.assignment-grid { gap: 10px; }
.assignment-card { border-radius: 7px; }
.assignment-card.overdue, .assignment-card.completed { border-left-width: 2px; }
.assignment-card h3 { color: var(--ink-950); font-weight: 630; }
.progress-track { height: 5px; border-radius: 2px; background: #e6e7e8; }
.progress-fill { border-radius: 2px; }
.lesson-layout { gap: 12px; }
.video-player { border-radius: 7px; border-color: #262b33; background: #0e1116; }
.video-screen { background: #10151d; }
.video-screen::after { display: none; }
.play-button { width: 62px; height: 62px; background: rgba(255, 255, 255, .06); }
.video-controls { background: #151b24; }
.outline-index { border-radius: 4px; }
.quiz-header, .question-card, .result-hero, .course-tree, .editor-canvas, .editor-block { border-radius: 7px; box-shadow: none; }
.option { border-radius: 5px; }
.option:hover { border-color: var(--role-accent-line); background: var(--role-accent-soft); }
.timer { border-radius: 4px; }
.question-type { border-radius: 5px; }
.alert { border-radius: 5px; }
.empty-icon { border-radius: 5px; }
.toast { border-left-width: 2px; border-radius: 6px; box-shadow: 0 16px 42px rgba(16, 17, 20, .12); }
.permission-card { border-radius: 8px; }

@media (max-width: 1100px) {
  .hero-grid { gap: 42px; }
  .public-nav { gap: 16px; }
  .environment-label { display: none; }
}

@media (max-width: 900px) {
  .public-nav.open { top: 70px; border-bottom-color: var(--line-200); box-shadow: 0 14px 32px rgba(16,17,20,.08); }
  .hero-grid { padding: 76px 0; }
  .product-preview { max-width: 720px; }
  .sidebar { background: #f4f4f1; box-shadow: 12px 0 34px rgba(16,17,20,.12); }
}

@media (max-width: 680px) {
  .container { width: min(calc(100% - 32px), var(--container)); }
  .hero-grid { padding: 60px 0; }
  .hero h1, .page-hero h1 { font-size: 42px; line-height: 1.04; }
  .hero p { font-size: 15px; }
  .console-headline { padding: 22px 18px 18px; }
  .console-headline strong { font-size: 19px; }
  .console-row { grid-template-columns: 26px minmax(0,1fr); padding: 14px 18px; }
  .console-state { grid-column: 2; width: max-content; }
  .console-footer div { padding: 14px; }
  .console-footer strong { font-size: 17px; }
  .section { padding: 68px 0; }
  .audience-grid { grid-template-columns: 1fr; }
  .audience-card + .audience-card { border-left: 0; border-top: 1px solid var(--line-200); }
  .workflow { grid-template-columns: 1fr; border-top: 0; }
  .workflow-step { padding: 18px 0; border-top: 1px solid var(--line-200); }
  .workflow-number { margin-bottom: 10px; }
  .feature-grid, .program-grid { grid-template-columns: 1fr; }
  .public-cta { grid-template-columns: 1fr; padding: 28px; }
  .auth-side { min-height: 260px; padding: 34px 24px; }
  .auth-side h1 { font-size: 38px; }
  .auth-workflow { display: none; }
  .app-main { padding: 18px 14px 28px; }
  .role-chip { display: none; }
  .topbar-title strong { font-size: 12px; }
  .page-heading h1 { font-size: 24px; }
  .kpi-card { min-height: 106px; }
  .data-table.mobile-cards tr { padding: 14px 12px; }
  .support-trigger { width: 44px; min-height: 44px; border-radius: 6px; }
}

@media print {
  .app-layout { background: #fff; }
  .panel, .kpi-card, .form-card { border-color: #ccc; }
}

/* Yen Center v3 · full-journey interface ================================== */

:root {
  --v3-cobalt: #0056d2;
  --v3-cobalt-dark: #003f9f;
  --v3-navy: #071b33;
  --v3-sky: #eaf3ff;
  --v3-mint: #e7f7f0;
  --v3-amber: #fff5dc;
  --v3-violet: #f2edff;
  --v3-canvas: #f7f8fa;
  --v3-border: #dfe3e8;
  --v3-shadow: 0 10px 28px rgba(7, 27, 51, .08);
  --sidebar: 252px;
  --topbar: 72px;
}

.ui-icon { width: 18px; height: 18px; flex: 0 0 auto; }
.eyebrow { margin: 0 0 8px; color: var(--v3-cobalt); font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
.eyebrow.on-dark { color: #85b8ff; }
.brand-light { color: #fff; }
.brand-light .brand-mark::before { background: #fff; }
.brand-light .brand-copy small { color: #9fb2c8; }
.text-link { display: inline-flex; align-items: center; gap: 5px; color: var(--v3-cobalt); font-size: 13px; font-weight: 750; }
.text-link .ui-icon { width: 15px; }
.stack-lg { display: grid; align-content: start; gap: 18px; }

.status { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; width: max-content; padding: 4px 8px; border: 1px solid transparent; border-radius: 999px; font-size: 10px; font-weight: 750; line-height: 1; white-space: nowrap; }
.status > span { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-success { color: #087443; background: #ebf8f1; border-color: #bde5cf; }
.status-warning { color: #9a5b00; background: #fff7e6; border-color: #f3d9a8; }
.status-danger { color: #b42318; background: #fff0ef; border-color: #f2c4c0; }
.status-info { color: #235c9e; background: #edf5ff; border-color: #c8dcf7; }

.progress-block { min-width: 120px; }
.progress-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; color: var(--ink-500); font-size: 11px; }
.progress-meta strong { color: var(--ink-700); }
.progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: #e8ebef; }
.progress-track > span { display: block; height: 100%; border-radius: inherit; background: var(--v3-cobalt); }

.public-header { position: sticky; top: 0; z-index: 100; height: 72px; border-bottom: 1px solid var(--line-200); background: rgba(255,255,255,.97); backdrop-filter: blur(16px); }
.public-header > .container { height: 100%; display: flex; align-items: center; gap: 30px; }
.public-header nav { display: flex; align-items: center; gap: 24px; margin-left: 20px; }
.public-header nav a { color: var(--ink-700); font-size: 13px; font-weight: 650; }
.public-header nav a:hover { color: var(--v3-cobalt); }
.public-actions { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.header-search { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink-600); }
.mobile-menu { display: none; border: 0; background: transparent; font-size: 24px; }

.public-main { min-height: 65vh; background: #fff; }
.public-page .btn-primary { background: var(--v3-cobalt); }
.public-page .btn-primary:hover { background: var(--v3-cobalt-dark); }
.hero { overflow: hidden; background: linear-gradient(116deg, #f4f8ff 0%, #fff 57%, #eef6ff 100%); }
.hero-grid { min-height: 640px; grid-template-columns: 1.02fr .98fr; padding: 76px 0 82px; }
.hero-copy h1 { max-width: 700px; margin: 0 0 22px; color: var(--v3-navy); font-size: clamp(45px, 5vw, 68px); font-weight: 680; line-height: 1.02; letter-spacing: -.055em; }
.hero-copy h1 span { color: var(--v3-cobalt); }
.hero-copy > p { max-width: 590px; margin-bottom: 28px; font-size: 18px; line-height: 1.65; }
.hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero-actions .btn { min-height: 48px; padding: 12px 20px; }
.hero-proof .ui-icon { width: 16px; color: var(--v3-cobalt); }
.hero-visual { position: relative; min-height: 430px; display: grid; place-items: center; }
.hero-visual::before { content: ""; position: absolute; width: 410px; height: 410px; border-radius: 50%; background: #dcecff; }
.learning-window { position: relative; z-index: 1; width: min(100%, 520px); overflow: hidden; border: 1px solid #cdd8e7; border-radius: 14px; background: #fff; box-shadow: 0 28px 70px rgba(25,68,124,.2); transform: rotate(-1.5deg); }
.window-bar { height: 42px; display: flex; align-items: center; gap: 6px; padding: 0 15px; background: #f6f7f9; border-bottom: 1px solid var(--line-200); }
.window-bar > span { width: 8px; height: 8px; border-radius: 50%; background: #ced4dd; }
.window-bar small { margin-left: 8px; color: var(--ink-500); font-weight: 650; }
.window-content { padding: 30px; }
.lesson-kicker { margin-bottom: 8px; color: var(--v3-cobalt); font-size: 10px; font-weight: 800; letter-spacing: .09em; }
.window-content h2 { margin: 0 0 5px; color: var(--v3-navy); font-size: 25px; letter-spacing: -.035em; }
.window-content > p { margin: 0 0 22px; color: var(--ink-500); font-size: 13px; }
.hero-progress { height: 7px; margin-bottom: 25px; overflow: hidden; border-radius: 999px; background: #e8edf4; }
.hero-progress span { display: block; height: 100%; background: var(--v3-cobalt); }
.module-preview { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line-100); }
.module-preview b { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--v3-mint); color: #087443; font-size: 12px; }
.module-preview.active b { background: var(--v3-cobalt); color: #fff; }
.module-preview strong, .module-preview small { display: block; }
.module-preview strong { color: var(--ink-800); font-size: 13px; }
.module-preview small { margin-top: 3px; color: var(--ink-500); font-size: 11px; }
.floating-stat { position: absolute; z-index: 2; right: -12px; bottom: 35px; display: grid; padding: 14px 18px; border: 1px solid #d8e2ef; border-radius: 10px; background: #fff; box-shadow: var(--v3-shadow); }
.floating-stat strong { color: #087443; font-size: 24px; }
.floating-stat span { color: var(--ink-500); font-size: 11px; }
.trust-strip { border-top: 1px solid var(--line-200); border-bottom: 1px solid var(--line-200); background: #fff; }
.trust-strip .container { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.trust-strip span { color: var(--ink-400); font-size: 10px; letter-spacing: .1em; }
.trust-strip strong { color: var(--ink-500); font-size: 13px; }

.public-section { padding-top: 84px; padding-bottom: 84px; }
.section-intro { max-width: 680px; margin: 0 auto 38px; text-align: center; }
.section-intro.align-left { margin-left: 0; text-align: left; }
.section-intro h2 { margin: 0 0 12px; color: var(--v3-navy); font-size: 38px; line-height: 1.12; letter-spacing: -.045em; }
.section-intro p:last-child { color: var(--ink-500); font-size: 16px; }
.program-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.program-card { overflow: hidden; border: 1px solid var(--line-200); border-radius: 10px; background: #fff; transition: transform .18s ease, box-shadow .18s ease; }
.program-card:hover { transform: translateY(-4px); box-shadow: var(--v3-shadow); }
.program-art { position: relative; height: 168px; display: flex; align-items: flex-end; justify-content: space-between; padding: 24px; color: #fff; background: linear-gradient(140deg, #0056d2, #003375); }
.program-art::after { content:""; position:absolute; width:180px; height:180px; right:-60px; top:-70px; border:42px solid rgba(255,255,255,.11); border-radius:50%; }
.program-art > span { font-size: 48px; font-weight: 250; opacity: .75; }
.program-art .ui-icon { width: 42px; height: 42px; }
.accent-violet .program-art { background: linear-gradient(140deg, #6d38cc, #392072); }
.accent-amber .program-art { background: linear-gradient(140deg, #d76b16, #873300); }
.program-body { padding: 24px; }
.program-body h3 { margin: 0 0 10px; color: var(--v3-navy); font-size: 21px; }
.program-body > p:not(.eyebrow) { min-height: 48px; color: var(--ink-500); }
.card-meta { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line-100); color: var(--ink-500); font-size: 11px; }
.program-body .btn { padding-left: 0; color: var(--v3-cobalt); }
.public-band { width: 100%; background: #f4f7fb; }
.feature-split { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 80px; }
.feature-split h2 { margin: 0 0 16px; color: var(--v3-navy); font-size: 40px; line-height: 1.15; letter-spacing: -.045em; }
.feature-split > div > p:not(.eyebrow) { color: var(--ink-600); font-size: 16px; line-height: 1.7; }
.evidence-card { padding: 28px; border: 1px solid var(--line-200); border-radius: 12px; background: #fff; box-shadow: var(--v3-shadow); }
.evidence-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 25px; }
.evidence-top b, .evidence-top small { display: block; }
.evidence-top small { color: var(--ink-500); font-size: 11px; }
.avatar-lg { width: 44px; height: 44px; }
.skill-row { display: grid; grid-template-columns: 145px 1fr 30px; align-items: center; gap: 12px; padding: 8px 0; font-size: 12px; }
.skill-row > div { height: 6px; overflow: hidden; border-radius: 999px; background: #e9edf2; }
.skill-row i { display: block; height: 100%; background: var(--v3-cobalt); }
